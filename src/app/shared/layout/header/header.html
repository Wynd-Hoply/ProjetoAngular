<mat-toolbar color="primary">
  <button class="small-button" routerLink="/home">
    <img src="assets/images/LogoWM.png" alt="Logo" class="logo" />
  </button>
  <span class="flex-spacer"></span>

  <button mat-button routerLink="/build-up">Monte seu PC</button>

  <button mat-button routerLink="/pre-builds">Pre Builds</button>

  @if (authService.isAuthenticated()) {
    <span class="auth-badge">{{ authService.displayName() }}</span>

    <button mat-stroked-button routerLink="/auth/login" type="button" (click)="authService.logout()">Sair</button>
  } @else {
    <button mat-stroked-button routerLink="/auth/login" type="button">Entrar</button>
    <button mat-button routerLink="/auth/register" type="button">Criar conta</button>
  }
  
  <button
  mat-button
  type="button"
  class="theme-toggle-btn"
  (click)="themeService.toggleTheme()"
  [attr.aria-label]="themeService.isDarkMode() ? 'Ativar modo claro' : 'Ativar modo escuro'"
>
  <span class="icon">
      {{ themeService.isDarkMode() ? '☀' : '☾' }}
  </span>
</button>
</mat-toolbar>
