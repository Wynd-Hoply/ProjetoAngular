<mat-toolbar class="custom-toolbar">
  <button class="logo-btn" routerLink="/home" aria-label="Ir para a página inicial">
    <img src="assets/images/LogoWM.png" alt="Logo" class="logo" />
  </button>

  <span class="flex-spacer"></span>

  <div class="header-actions">
    <button mat-button routerLink="/home">Início</button>
    <button mat-button routerLink="/auto-build">Auto Build</button>

    <!-- Botão Peças com destaque de aba ativa quando aberto -->
    <div class="pieces-menu" [class.pieces-menu--open]="piecesMenuOpen()">
      <button
        mat-button
        type="button"
        class="pieces-menu__trigger"
        [class.active-tab]="piecesMenuOpen()"
        aria-haspopup="true"
        [attr.aria-expanded]="piecesMenuOpen()"
        aria-controls="pieces-menu-panel"
        (click)="togglePiecesMenu()"
      >
        Peças <span class="arrow">▾</span>
      </button>

      @if (piecesMenuOpen()) {
        <div id="pieces-menu-panel" class="pieces-menu__panel" role="menu" aria-label="Menu de peças">
          <div class="pieces-menu__section">
            <p class="pieces-menu__section-title">Componentes Principais</p>

            <div class="mega-grid">
              @for (item of pcComponents; track item.route) {
                <a
                  class="pieces-card-item"
                  [routerLink]="item.route"
                  role="menuitem"
                  (click)="closePiecesMenu()"
                >
                  <div class="pieces-card-img">
                    <img [src]="item.image" [alt]="item.label" />
                  </div>
                  <div class="pieces-card-info">
                    <span class="pieces-card-label">{{ item.label }}</span>
                    <span class="pieces-card-sub">Ver catálogo</span>
                  </div>
                </a>
              }
            </div>
          </div>
        </div>
      }
    </div>

    <button mat-button routerLink="/build-up">Monte seu PC</button>
    <button mat-button routerLink="/builds">Builds de Usuários</button>
    <button mat-button routerLink="/compare">Comparar</button>

    @if (authService.isAuthenticated()) {
      <span class="auth-badge">{{ authService.displayName() }}</span>
      <button mat-stroked-button class="btn-outline" routerLink="/auth/login" type="button" (click)="authService.logout()">Sair</button>
    } @else {
      <button mat-stroked-button class="btn-outline" type="button" (click)="openLogin()">Entrar</button>
      <button mat-flat-button class="btn-primary" routerLink="/auth/register" type="button">Cadastre-se</button>
    }

    <button
      mat-icon-button
      type="button"
      class="theme-toggle-btn"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.isDarkMode() ? 'Ativar modo claro' : 'Ativar modo escuro'"
    >
      <span class="icon">
        {{ themeService.isDarkMode() ? '☀' : '☾' }}
      </span>
    </button>
  </div>
</mat-toolbar>
