<main class="home-page">
    <!-- ... (Seção Hero mantida igual) ... -->

    <section class="catalog-preview" aria-labelledby="categories-title">
        <div class="section-intro">
            <div>
                <p class="eyebrow">Comece por onde preferir</p>
                <h2 id="categories-title">Encontre seus componentes</h2>
            </div>
            <a routerLink="/components">Ver catálogo completo <span aria-hidden="true">→</span></a>
        </div>
        <div class="category-grid">
            @for (category of categories; track category.route) {
                <!-- Link da Categoria -->
                <a class="category-card" [routerLink]="['/components', category.route]">
                    
                    <!-- Container do Ícone/Imagem (Corrigido) -->
                    <div class="category-card__icon" aria-hidden="true">
                        <!-- A TAG IMG AQUI É O SEU PROBLEMA NA IMAGEM -->
                        <!-- O Angular faz o bind com [src] e [alt] -->
                        <img [src]="category.image" [alt]="category.label" class="category-img-fit" />
                    </div>
                    
                    <!-- Corpo do Card -->
                    <span class="category-card__body">
                        <strong>{{ category.label }}</strong>
                        <small>{{ category.description }}</small>
                    </span>
                    
                    <!-- Seta -->
                    <span class="category-card__arrow" aria-hidden="true">↗</span>
                </a>
            }
        </div>
    </section>

    <!-- ... (Seções How It Works e Cta mantidas) ... -->
</main>
